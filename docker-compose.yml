
# ─────────────────────────────────────────────────────────────────────────────
# Scribe — full local stack
#
# Services:
#   postgres  — relational DB (documents, sessions, versions, export_jobs)
#   redis     — Celery broker + result backend
#   minio     — S3-compatible file storage (uploaded docs + exports)
#   qdrant    — vector DB (BGE-M3 embeddings for RAG)
#   api       — FastAPI server  →  http://localhost:18000
#   worker    — Celery worker (parse + embed tasks)
#   mc        — MinIO client (one-shot: creates the bucket on first run)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scribe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documentparser}
      POSTGRES_USER: ${POSTGRES_USER:-documentparser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documentparser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scribe_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: scribe_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web console  →  http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MinIO bucket initialiser (runs once, then exits) ──────────────────────
  mc:
    image: quay.io/minio/mc:latest
    container_name: scribe_mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET:-documentparser};
        mc anonymous set download local/${MINIO_BUCKET:-documentparser};
        echo 'MinIO bucket ready.';
      "
    restart: "no"

  # ── MongoDB (MemPalace vector backend) ─────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: scribe_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-scribe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: scribe_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST + gRPC
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  # ── FastAPI — REST + WebSocket ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: scribe_backend:latest
    container_name: scribe_api
    restart: unless-stopped
    volumes:
      - ./backend:/code   # live-reload: code changes take effect without rebuild
      - huggingface_cache:/tmp/huggingface
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --reload
        --ws websockets
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs to use Docker service names
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-documentparser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-documentparser}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MONGO_URL: mongodb://${MONGO_USER:-scribe}:${MONGO_PASSWORD:-changeme}@mongodb:27017/mempalace?authSource=admin
      MEMPALACE_PATH: /tmp/mempalace/palace
      HF_HOME: "/tmp/huggingface"
      GROQ_MODEL: llama-3.1-8b-instant
    ports:
      - "18000:8000"   # host:18000  →  container:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery worker (parse + embed tasks) ────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: scribe_backend:latest
    container_name: scribe_worker
    restart: unless-stopped
    volumes:
      - mempalace_data:/tmp/mempalace
      - ./backend:/code   # live-reload: code changes take effect without rebuild
      - huggingface_cache:/tmp/huggingface
    command: >
      celery -A app.tasks.celery_app worker
        --queues parse
        --concurrency 2
        --loglevel info
        --without-gossip
        --without-mingle
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-documentparser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-documentparser}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MONGO_URL: mongodb://${MONGO_USER:-scribe}:${MONGO_PASSWORD:-changeme}@mongodb:27017/mempalace?authSource=admin
      MEMPALACE_PATH: /tmp/mempalace/palace
      HF_HOME: "/tmp/huggingface"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ── Named volumes (data persists across container restarts) ──────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  mongodb_data:
  mempalace_data:
  huggingface_cache:
